services:
  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fortus}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fortus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fortus}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "${APP_PORT:-8080}:8080"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fortus}
      POSTGRES_USER: ${POSTGRES_USER:-fortus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fortus}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
